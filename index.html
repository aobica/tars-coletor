    <div class="card"><h3>⚠ Zona de perigo</h3><button class="btn danger full" onclick="excluirPerfil()">🗑 Remover este perfil do celular</button><div class="small muted" style="margin-top:6px">Apaga só do celular (resumo e fila). ${sessao.d.fila.length ? `<b class="neg">Há ${sessao.d.fila.length} lançamento(s) não enviados.</b>` : ''}</div></div>
    <div class="center small muted">TARS · Coletor v${VER}</div>`;
}
async function excluirPerfil() {
  const r = await sheet('🗑 Remover perfil', `Remover <b>${esc(sessao.p.apelido || sessao.p.nome)}</b> deste celular? ${sessao.d.fila.length ? `<br><b class="neg">${sessao.d.fila.length} lançamento(s) da fila serão perdidos.</b>` : ''}`, [['x', 'Cancelar', 'ghost'], ['ok', 'Remover', 'danger']], );
  if (r.k !== 'ok') return; const id = sessao.p.id; await _grav;
  localStorage.removeItem(LS_D + id); salvarPerfis(perfis().filter(p => p.id !== id)); sessao = null; document.body.classList.add('locked'); lockUI = { etapa: 'auto' }; renderLock(); toast('Perfil removido', 'info');
}

/* ---------- boas-vindas do TARS ---------- */
const FR = [['{s}, {n}. Coletor online. Pronto para registrar.', '{s}, {n}. Acesso autorizado.'],
  ['{s}, {n}! Ranger pronta para a missão.', '{s}, {n}! Câmera calibrada, é só fotografar o cupom.', '{s}, {n}! Coletor online: nenhum cupom escapa.'],
  ['{s}, {n}! Humor em {h}%: mostra o cupom que eu digo quanto doeu.', '{s}, {n}! A Ranger decolou. A nave-mãe agradece cada lançamento.', '{s}, {n}! Fotografa o cupom antes que ele desbote: papel térmico não perdoa.', '{s}, {n}! Pronto para registrar. O pinhão também conta como receita, viu?']];
function boasVindas() {
  const p = sessao.p, hum = +p.humor || 0, nv = hum <= 30 ? 0 : hum <= 70 ? 1 : 2, hr = new Date().getHours();
  const s = hr >= 5 && hr < 12 ? 'Bom dia' : hr < 18 && hr >= 12 ? 'Boa tarde' : 'Boa noite', n = p.apelido || String(p.nome).split(' ')[0];
  const msg = FR[nv][Math.floor(Math.random() * FR[nv].length)].replace('{s}', s).replace('{n}', n).replace('{h}', hum);
  const r = R(), ins = [];
  if (!r) ins.push(['warn', 'Sem resumo do PC: abra o tars_resumo para ver saldos e alertas.']);
  else {
    if (idadeResumoH(r) > 72) ins.push(['warn', `Resumo com ${Math.floor(idadeResumoH(r) / 24)} dias: gere outro no PC.`]);
    if (r.alertas.length) ins.push(['neg', `${r.alertas.length} conta(s) em alerta de saldo nos próximos 30 dias.`]);
    const v = r.pendencias.filter(x => x.data < hoje()).length; if (v) ins.push(['neg', `${v} conta(s) vencida(s) aguardando confirmação.`]);
    if (!r.alertas.length && !v) ins.push(['pos', 'Nenhum alerta de saldo. Céu limpo.']);
  }
  if (sessao.d.fila.length) ins.push(['info', `${sessao.d.fila.length} lançamento(s) na fila para enviar ao PC.`]);
  $id('sheetBox').innerHTML = `<div class="row" style="margin-bottom:10px"><span class="logo">◢ TARS</span><span class="small muted">humor ${hum}%</span></div><div class="tmsg" id="tm"></div>
    <div id="tins" style="opacity:0;transition:opacity .4s;margin-top:10px">${ins.map(([c, t]) => `<div class="al ${c}">${esc(t)}</div>`).join('')}</div>
    <div class="acts"><button class="btn primary" onclick="fecharSheet()">Vamos lá 🚀</button></div>`;
  $id('sheet').classList.remove('hidden');
  let k = 0; const el = $id('tm'), tm = setInterval(() => { k++; if (!el.isConnected) return clearInterval(tm); el.innerHTML = esc(msg.slice(0, k)) + '<span class="cur"></span>'; if (k >= msg.length) { clearInterval(tm); el.textContent = msg; $id('tins').style.opacity = 1; } }, 22);
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  setTema(localStorage.getItem(LS_T) || 'tars');
  renderLock();
  ['touchstart', 'mousedown', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, () => { ultimaAtiv = Date.now(); }, { passive: true }));
  setInterval(() => { if (sessao && Date.now() - ultimaAtiv > BLOQ_MIN * 60000) bloquear(`🔒 Bloqueado após ${BLOQ_MIN} min sem uso`); }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) ocultoEm = Date.now(); else if (sessao && ocultoEm && Date.now() - ocultoEm > BG_LOCK_S * 1000) bloquear('🔒 Bloqueado ao voltar para o app'); });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && !sessao && e.target.closest && e.target.closest('#lockBox')) { const b = $id('lockBox').querySelector('[data-enter]'); if (b && !b.disabled) { e.preventDefault(); b.click(); } } });
  $id('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { fecharSheet(); _sheetRes && _sheetRes({ k: 'x' }); } });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn(e));
});
